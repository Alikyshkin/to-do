<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Список дел с локальным сохранением задач, редактированием и фильтрами по статусу.">
  <title>Список дел</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="heading">
      <h1>Список дел</h1>
      <p id="task-summary" role="status">Нет задач</p>
    </header>

    <form id="task-form" class="composer">
      <label for="task-input">Новая задача</label>
      <div class="composer-fields">
        <input type="text" id="task-input" placeholder="Что нужно сделать?" autocomplete="off" required>
        <button type="submit" class="primary-button">Добавить</button>
      </div>
    </form>
    <p id="storage-warning" class="storage-warning" role="alert" hidden></p>

    <section class="tasks" aria-label="Задачи">
      <fieldset class="filters">
        <legend class="visually-hidden">Показать задачи по статусу</legend>
        <label><input type="radio" name="filter" value="all" checked><span>Все</span></label>
        <label><input type="radio" name="filter" value="active"><span>Активные</span></label>
        <label><input type="radio" name="filter" value="completed"><span>Выполненные</span></label>
      </fieldset>
      <p id="empty-state" class="empty-state">Пока нет задач.</p>
      <ul id="task-list" aria-label="Список задач"></ul>
    </section>
  </main>
</body>
</html>
